server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;
    charset utf-8;
    # Redirects keep the visitor's https://frostedharmony.com address instead of nginx's own http://.
    absolute_redirect off;

    include /etc/nginx/conf.d/security-headers.inc;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Admin portal API: needs sign-in (see api/routes/admin.js). Slightly larger request limit.
    location /api/admin/ {
        client_max_body_size 64k;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Admin portal pages: never cached by browsers or Cloudflare, never indexed by search engines.
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # Home page: the version published from the admin portal (written by the API into the data
    # volume) if there is one, otherwise the original site/index.html. Browsers re-check it on every
    # visit so a publish shows up immediately.
    location = / {
        root /var/www/data/site;
        try_files /index.html @original_index;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        root /var/www/data/site;
        try_files /index.html @original_index;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location @original_index {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Instagram gallery and inquiry form API.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Instagram photos downloaded by the API container.
    location /ig/ {
        alias /var/www/data/media/;
        expires 1h;
    }

    location ~* \.(css|js|svg|png|jpe?g|webp|ico)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
